<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00bfff" />
    <title>forgeVidhya — AI skills for tier-3 engineering students</title>
    <meta
      name="description"
      content="forgeVidhya equips first-year engineering students in India's tier-3 colleges with future-ready AI skills — automation, production, and turning imagination into reality with AI."
    />
    <meta name="keywords" content="AI automation, AI production, engineering students, tier 3 colleges India, AI skills, learn AI, no code AI, AI for beginners, future ready skills" />
    <meta name="author" content="forgeVidhya" />

    <!-- Open Graph -->
    <meta property="og:title" content="forgeVidhya — Forge the future with AI" />
    <meta
      property="og:description"
      content="AI automation, AI production, and turning imagination into reality — built for first-year engineering students in India's tier-3 colleges."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://forgevidhya.example.com" />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:site_name" content="forgeVidhya" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="forgeVidhya — Forge the future with AI" />
    <meta
      name="twitter:description"
      content="AI skills for tier-3 engineering students. Free foundational track."
    />
    <meta name="twitter:image" content="/icon.png" />

    <!-- Favicon. The colour-scheme variants that used to sit here pointed at
         /favicon-light.png and /favicon-dark.png, and neither file has ever
         existed: every browser that honours `media` on an icon link asked the
         server for a missing file, and under the SPA rewrite it was handed the
         HTML shell in place of an image. Restore the pair only alongside the
         two artwork files. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Loading curtain. The rules live here, not in the React component,
         because the boot curtain below has to be styled before any script
         has run. The component reuses the same classes. -->
    <style>
      .buffering-overlay {
        position: fixed;
        inset: 0;
        /* One below the magic cursor, also 9999, so the cursor stays drawn
           on top of the curtain rather than under it. */
        z-index: 9998;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .buffering-overlay.visible { opacity: 1; pointer-events: auto; }
      .buffering-overlay img {
        width: 132px;
        height: 132px;
        animation: breathe 2.4s ease-in-out infinite;
      }
      .buffering-overlay .label {
        font-weight: 600;
        /* Explicit: the curtain is near-white and the site's body ink is the
           brand orange, which measures 1.95:1 on white — present but
           unreadable. */
        color: #1b2436;
        font-family: 'Sora', system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.045); }
      }
      @media (prefers-reduced-motion: reduce) {
        .buffering-overlay img { animation: none; }
        .buffering-overlay { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Boot curtain: plain markup so it is on screen from the first byte,
         before React has mounted. The app removes it once the page has
         finished loading, and owns the curtain for tab changes after that. -->
    <div id="boot-buffering" class="buffering-overlay visible" role="status" aria-live="polite">
      <img src="/logo-buffering.png" alt="" />
      <span class="label">Loading</span>
    </div>
  </body>
</html>
